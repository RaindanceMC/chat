id: chat-support
title: Supporting the server
summary: "Where to chip in, if you'd like to."
intro: |
  Servers cost money and time. If you enjoy this one and want to help, here's how — and if not, that's fine too.
icon: EMERALD
category: Chat & community
order: 14
module: chat
when: chat-support:support.enabled
permission: chat.support
aliases: [support, donate, coffee]
keywords: [donation, tip, buymeacoffee]
commands: [support]
related: [chat]
sections:
  - question: How can I support the server?
    title: The support link
    text: |
      {cmd:/support} opens a little window with the link. After <white>{setting:chat-support:support.after-minutes|minutes}</white> of playtime you also get a message in chat pointing at it, just you. Supporting is optional.
  - question: Do supporters get anything?
    title: A little thank-you
    when: chat-support:support.rewards
    text: |
      The window shows your own code. Write it in your coffee's message, and a <#C8A27A>☕</#C8A27A> badge by your name, a coffee-bean trail, weapon skins and the whole library of particles and sounds in {cmd:/cosmetics} are yours — only ever cosmetic, nothing that helps in the game. You can hide the badge in Cosmetics.
