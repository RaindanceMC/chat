# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.
# A line the owner rewrote in plugins/RainsCore/messages.yml wins in both tones.

chat:
  poll:
    voted: "<green>Vote counted: <white><answer></white>."
    tie: "<yellow>  It's a tie between <white><answers></white>."
    nobody-voted: "<gray>  Nobody voted."
    length: "<red>The duration must be between 10 seconds and an hour."
  private:
    not-yourself: "<red>That would be yourself. You are already in this chat."
  support:
    notice: "<#C8A27A>☕ <#F3E3CC>You have a new message. <open>"
    window:
      title: "<#C8A27A>☕ <#F3E3CC>Supporting the server"
      greeting: |-
        <#F3E3CC><bold>Hello <player>,</bold>
        <#D9BFA0>thank you for playing here.
      text: "<#D9BFA0>This server is run privately and paid for out of pocket. If you enjoy it, you can contribute to its running costs."
      signature: "<#E8B98A>— <name>"
      footer: "<#C8A27A>Entirely optional — thank you for being part of it."
      later: "<#E8D9C4>Close"
      code: "<#D9BFA0>Include <#F3E3CC><bold><code></bold><#D9BFA0> in your message to receive a <#C8A27A>☕</#C8A27A> supporter badge, a coffee-bean particle trail and weapon skins."
      supporter: "<#C8A27A>☕ <#F3E3CC>You are a supporter. Thank you."
    thanks: |-
      <#C8A27A>☕ <#F3E3CC><bold>Thank you, <player>.</bold>
      <#D9BFA0>Your support has been received. The <#C8A27A>☕</#C8A27A> badge, the coffee-bean trail and weapon skins in /cosmetics are now available to you.
